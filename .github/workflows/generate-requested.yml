name: Generate Hillshades (Simple)

on:
  push:
    branches: [main, v2-simmon]
    paths:
      - 'requests/*.yaml'
  workflow_dispatch:
    inputs:
      county:
        description: 'County name'
        required: true
      styles:
        description: 'Styles (comma-separated)'
        default: 'dark'
      exaggerations:
        description: 'Exaggerations (comma-separated)'
        default: '9'
      debug:
        description: 'Keep EC2 worker alive after completion for troubleshooting'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  parse-requests:
    runs-on: ubuntu-latest
    outputs:
      counties: ${{ steps.parse.outputs.counties }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Parse pending requests
        id: parse
        run: |
          pip install pyyaml
          python3 << 'EOF'
          import yaml, json, os, glob
          
          pending = []
          for path in sorted(glob.glob('requests/*.yaml')):
              with open(path) as f:
                  r = yaml.safe_load(f)
              if not r or r.get('status') != 'pending':
                  continue
              pending.append({
                  'county': r['county'],
                  'dem': r.get('dem', 'dtm'),
                  'styles': r.get('theme', ','.join(r.get('styles', ['dark']))),
                  'exaggerations': str(r.get('exaggeration', ','.join(str(e) for e in r.get('exaggerations', [9])))),
                  'zoom': r.get('zoom', '10-16'),
                  'debug': str(r.get('debug', False)).lower(),
                  'request_file': path,
              })
          
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"counties={json.dumps(pending)}\n")
          
          print(f"Found {len(pending)} pending request(s):")
          for p in pending:
              print(f"  - {p['county']}: {p['styles']} @ {p['exaggerations']}x ({p['request_file']})")
          EOF

  generate:
    needs: parse-requests
    if: needs.parse-requests.outputs.counties != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        request: ${{ fromJson(needs.parse-requests.outputs.counties) }}
      max-parallel: 1
      fail-fast: false
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      
      - name: Generate hillshades
        env:
          COUNTY: ${{ matrix.request.county }}
          DEM: ${{ matrix.request.dem }}
          STYLES: ${{ matrix.request.styles }}
          EXAGGERATIONS: ${{ matrix.request.exaggerations }}
          ZOOM: ${{ matrix.request.zoom }}
          SECURITY_GROUP: ${{ secrets.AWS_SECURITY_GROUP }}
          KEY_PAIR_NAME: ${{ secrets.AWS_KEY_PAIR_NAME }}
          IAM_INSTANCE_PROFILE: ${{ secrets.AWS_IAM_INSTANCE_PROFILE }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          WORKER_INSTANCE_TYPE: c7g.2xlarge
          DEBUG_KEEP_ALIVE: ${{ github.event.inputs.debug || 'false' }}
        run: |
          set -x
          
          echo "🗺️  Generating hillshades for $COUNTY"
          echo "   DEM: $DEM"
          echo "   Styles: $STYLES"
          echo "   Exaggerations: $EXAGGERATIONS"
          echo "   Zoom: $ZOOM"
          
          # Write SSH key before running generate-aws.sh (it needs it for SG rules + monitoring)
          mkdir -p ~/.ssh
          echo "${{ secrets.TILE_SERVER_SSH_KEY }}" > ~/.ssh/mapserver-ec2.pem
          chmod 600 ~/.ssh/mapserver-ec2.pem
          
          cd aws
          
          # Run the proven generate-aws.sh script
          ./generate-aws.sh "$COUNTY" \
            --dem "$DEM" \
            --style "$STYLES" \
            --exaggeration "$EXAGGERATIONS" \
            --zoom "$ZOOM" 2>&1 | tee /tmp/generate-${COUNTY}.log
          
          # Extract worker info
          if [ -f "/tmp/hillshade-worker-${COUNTY}.env" ]; then
            source /tmp/hillshade-worker-${COUNTY}.env
            echo "Worker: $WORKER_IP ($WORKER_INSTANCE_ID)"
            
            # Write startup manifest to S3 for tracking/cleanup
            RUN_ID="${COUNTY}-$(date +%Y%m%d-%H%M%S)"
            cat > /tmp/run-manifest.json << MANIFEST
          {
            "run_id": "${RUN_ID}",
            "county": "${COUNTY}",
            "dem": "${DEM}",
            "styles": "${STYLES}",
            "exaggerations": "${EXAGGERATIONS}",
            "zoom": "${ZOOM}",
            "debug": "${DEBUG_KEEP_ALIVE}",
            "instance_id": "${WORKER_INSTANCE_ID}",
            "instance_ip": "${WORKER_IP}",
            "instance_type": "${WORKER_INSTANCE_TYPE}",
            "github_run_id": "${{ github.run_id }}",
            "github_run_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "github_sha": "${{ github.sha }}",
            "github_ref": "${{ github.ref }}",
            "triggered_by": "${{ github.actor }}",
            "started_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "status": "running"
          }
          MANIFEST
            aws s3 cp /tmp/run-manifest.json s3://$S3_BUCKET/ci/runs/${RUN_ID}.json || true
            echo "📋 Run manifest: s3://$S3_BUCKET/ci/runs/${RUN_ID}.json"
          else
            echo "❌ Worker info not found, script may have failed"
            aws s3 cp /tmp/generate-${COUNTY}.log s3://$S3_BUCKET/ci/logs/${COUNTY}-failed-$(date +%Y%m%d-%H%M%S).log || true
            exit 1
          fi
          
          # Wait for SSH to be ready (key already at ~/.ssh/mapserver-ec2.pem)
          echo "⏳ Waiting for SSH access..."
          for i in {1..30}; do
            if ssh -i ~/.ssh/mapserver-ec2.pem -o StrictHostKeyChecking=no -o ConnectTimeout=5 \
                ubuntu@$WORKER_IP 'echo ready' 2>/dev/null; then
              echo "✅ SSH ready"
              break
            fi
            sleep 10
          done
          
          # Wait for worker to finish (poll every 2 min, max 2 hours)
          echo "⏳ Waiting for worker to complete generation..."
          MAX_ITERATIONS=60
          ITERATION=0
          
          while [ $ITERATION -lt $MAX_ITERATIONS ]; do
            ITERATION=$((ITERATION + 1))
            
            # Check if worker still exists
            WORKER_STATE=$(aws ec2 describe-instances \
              --instance-ids "$WORKER_INSTANCE_ID" \
              --query 'Reservations[0].Instances[0].State.Name' \
              --output text 2>/dev/null || echo "terminated")
            
            if [ "$WORKER_STATE" = "terminated" ]; then
              echo "✅ Worker terminated (generation complete or failed)"
              break
            fi
            
            # Collect progress stats via SSH
            echo "[$ITERATION/$MAX_ITERATIONS] Worker state: $WORKER_STATE"
            
            PROGRESS=$(ssh -i ~/.ssh/mapserver-ec2.pem -o StrictHostKeyChecking=no -o ConnectTimeout=10 ubuntu@$WORKER_IP '
              df -h /data | tail -1 | awk '"'"'{printf "   💾 Disk: %s (%s full)\n", $3, $5}'"'"'
              uptime | awk -F"load average:" '"'"'{print "   🖥️  CPU load:" $2}'"'"' | cut -d, -f1
              echo "   📦 Output: $(find /data/output -name "*.mbtiles" 2>/dev/null | wc -l) mbtiles ($(du -sh /data/output 2>/dev/null | cut -f1 || echo 0))"
              if [ -f /var/log/hillshade-gen.log ]; then
                echo "   📋 Latest: $(tail -1 /var/log/hillshade-gen.log 2>/dev/null | cut -c1-80)"
              fi
              [ -f /data/output/DONE ] && echo "DONE_FOUND"
            ' 2>/dev/null || echo "   (SSH failed)")
            
            echo "$PROGRESS"
            
            # Break if DONE marker found
            if echo "$PROGRESS" | grep -q "DONE_FOUND"; then
              echo "🎉 Generation complete!"
              break
            fi
            
            sleep 120
          done
          
          if [ $ITERATION -ge $MAX_ITERATIONS ]; then
            echo "⚠️  Timeout after 2 hours"
            if [ "$DEBUG_KEEP_ALIVE" = "true" ]; then
              echo "🔧 DEBUG: Keeping worker alive for troubleshooting"
              echo "   SSH: ssh -i ~/.ssh/mapserver-ec2.pem ubuntu@$WORKER_IP"
            else
              echo "Terminating worker..."
              aws ec2 terminate-instances --instance-ids "$WORKER_INSTANCE_ID" --region us-east-2 || true
            fi
          fi
          
          # Download tiles from worker via SCP
          echo "📥 Downloading tiles from worker..."
          mkdir -p /tmp/tiles
          
          # List what's on the worker
          ssh -i ~/.ssh/mapserver-ec2.pem -o StrictHostKeyChecking=no ubuntu@$WORKER_IP \
            'find /data/output -name "*.mbtiles" -exec ls -lh {} \;' 2>/dev/null || true
          
          # SCP all mbtiles
          scp -i ~/.ssh/mapserver-ec2.pem -o StrictHostKeyChecking=no \
            "ubuntu@$WORKER_IP:/data/output/${COUNTY}/*/*.mbtiles" /tmp/tiles/ 2>&1 || true
          
          TILE_COUNT=$(ls /tmp/tiles/*.mbtiles 2>/dev/null | wc -l)
          if [ "$TILE_COUNT" -eq 0 ]; then
            echo "❌ No tiles found on worker"
            # Try broader search
            scp -i ~/.ssh/mapserver-ec2.pem -o StrictHostKeyChecking=no \
              "ubuntu@$WORKER_IP:/data/output/*.mbtiles" /tmp/tiles/ 2>&1 || true
            TILE_COUNT=$(ls /tmp/tiles/*.mbtiles 2>/dev/null | wc -l)
          fi
          
          if [ "$TILE_COUNT" -eq 0 ]; then
            echo "❌ Still no tiles found. Checking worker output structure:"
            ssh -i ~/.ssh/mapserver-ec2.pem -o StrictHostKeyChecking=no ubuntu@$WORKER_IP \
              'find /data/output -type f 2>/dev/null | head -30' || true
            # Grab full worker logs for debugging
            ssh -i ~/.ssh/mapserver-ec2.pem -o StrictHostKeyChecking=no ubuntu@$WORKER_IP \
              'cat /var/log/hillshade-gen.log 2>/dev/null' > /tmp/worker-hillshade-gen.log 2>/dev/null || true
            aws s3 cp /tmp/generate-${COUNTY}.log s3://$S3_BUCKET/ci/logs/${COUNTY}-failed-$(date +%Y%m%d-%H%M%S).log || true
            aws s3 cp /tmp/worker-hillshade-gen.log s3://$S3_BUCKET/ci/logs/${COUNTY}-worker-$(date +%Y%m%d-%H%M%S).log 2>/dev/null || true
            if [ "$DEBUG_KEEP_ALIVE" = "true" ]; then
              echo "🔧 DEBUG: Worker kept alive at $WORKER_IP for troubleshooting"
              echo "   ssh -i ~/.ssh/mapserver-ec2.pem ubuntu@$WORKER_IP"
              echo "   ⚠️  Terminate when done: aws ec2 terminate-instances --instance-ids $WORKER_INSTANCE_ID --region us-east-2"
            else
              aws ec2 terminate-instances --instance-ids "$WORKER_INSTANCE_ID" --region us-east-2 || true
            fi
            exit 1
          fi
          
          echo "✅ Downloaded $TILE_COUNT tile(s):"
          ls -lh /tmp/tiles/
          
          # Upload success log to S3
          aws s3 cp /tmp/generate-${COUNTY}.log \
            s3://$S3_BUCKET/ci/logs/${COUNTY}-success-$(date +%Y%m%d-%H%M%S).log
          
          echo "✅ Generation complete for $COUNTY"
      
      - name: Upload to tile server
        if: success()
        env:
          TILE_SERVER_SSH: ${{ secrets.TILE_SERVER_SSH }}
        run: |
          # Setup SSH key
          mkdir -p ~/.ssh
          echo "${{ secrets.TILE_SERVER_SSH_KEY }}" > ~/.ssh/tile-server.pem
          chmod 600 ~/.ssh/tile-server.pem
          
          # Upload each tile
          for mbtiles in /tmp/tiles/*.mbtiles; do
            if [ -f "$mbtiles" ]; then
              basename=$(basename "$mbtiles")
              echo "Uploading $basename..."
              scp -i ~/.ssh/tile-server.pem -o StrictHostKeyChecking=no \
                "$mbtiles" "$TILE_SERVER_SSH:/data/tiles/"
            fi
          done
          
          # Restart mbtileserver
          ssh -i ~/.ssh/tile-server.pem -o StrictHostKeyChecking=no \
            "$TILE_SERVER_SSH" 'cd /data && sudo docker compose restart mbtileserver'
          
          echo "✅ Tiles deployed to tile server"
      
      - name: Mark as completed
        if: success()
        run: |
          python3 << 'EOF'
          import yaml, os, glob
          
          county = os.environ['COUNTY']
          request_file = os.environ.get('REQUEST_FILE', '')
          
          # Find the request file
          if request_file and os.path.exists(request_file):
              target = request_file
          else:
              # Fallback: find by county name
              candidates = glob.glob(f'requests/{county}-*.yaml')
              target = candidates[0] if candidates else None
          
          if target:
              with open(target) as f:
                  data = yaml.safe_load(f)
              data['status'] = 'completed'
              data['generated_at'] = os.environ.get('GITHUB_RUN_STARTED_AT', '')
              data['github_run'] = os.environ.get('GITHUB_RUN_URL', '')
              with open(target, 'w') as f:
                  yaml.dump(data, f, default_flow_style=False, sort_keys=False)
              print(f"Marked {target} as completed")
          else:
              print(f"Warning: could not find request file for {county}")
          EOF
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add requests/
          git commit -m "Mark ${{ matrix.request.county }} as completed [skip ci]" || true
          git push || true
        env:
          COUNTY: ${{ matrix.request.county }}
          STYLES: ${{ matrix.request.styles }}
          EXAGGERATIONS: ${{ matrix.request.exaggerations }}
          REQUEST_FILE: ${{ matrix.request.request_file }}
          GITHUB_RUN_STARTED_AT: ${{ github.event.head_commit.timestamp }}
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
