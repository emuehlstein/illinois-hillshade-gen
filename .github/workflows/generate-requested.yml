name: Generate Hillshades (Simple)

on:
  push:
    branches: [main, v2-simmon]
    paths:
      - 'requests/*.yaml'
  workflow_dispatch:
    inputs:
      county:
        description: 'County name'
        required: true
      styles:
        description: 'Styles (comma-separated)'
        default: 'dark'
      exaggerations:
        description: 'Exaggerations (comma-separated)'
        default: '9'
      debug:
        description: 'Keep EC2 worker alive after completion for troubleshooting'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  parse-requests:
    runs-on: ubuntu-latest
    outputs:
      counties: ${{ steps.parse.outputs.counties }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Parse pending requests
        id: parse
        run: |
          pip install pyyaml
          python3 << 'EOF'
          import yaml, json, os, glob
          
          pending = []
          for path in sorted(glob.glob('requests/*.yaml')):
              with open(path) as f:
                  r = yaml.safe_load(f)
              if not r or r.get('status') != 'pending':
                  continue
              pending.append({
                  'county': r['county'],
                  'dem': r.get('dem', 'dtm'),
                  'styles': r.get('theme', ','.join(r.get('styles', ['dark']))),
                  'exaggerations': str(r.get('exaggeration', ','.join(str(e) for e in r.get('exaggerations', [9])))),
                  'zoom': r.get('zoom', '10-16'),
                  'zooms': r.get('zooms', None),
                  'disk': str(r.get('disk', 200)),
                  'debug': str(r.get('debug', False)).lower(),
                  'request_file': path,
              })
          
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"counties={json.dumps(pending)}\n")
          
          print(f"Found {len(pending)} pending request(s):")
          for p in pending:
              print(f"  - {p['county']}: {p['styles']} @ {p['exaggerations']}x ({p['request_file']})")
          EOF

  generate:
    needs: parse-requests
    if: needs.parse-requests.outputs.counties != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        request: ${{ fromJson(needs.parse-requests.outputs.counties) }}
      max-parallel: 1
      fail-fast: false
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      
      - name: Check for existing tiles
        env:
          COUNTY: ${{ matrix.request.county }}
          TILE_SERVER_SSH: ${{ secrets.TILE_SERVER_SSH }}
        run: |
          echo "🔍 Checking tile server for existing $COUNTY tiles..."
          
          mkdir -p ~/.ssh /tmp/tiles
          echo "${{ secrets.TILE_SERVER_SSH_KEY }}" > ~/.ssh/mapserver-ec2.pem
          chmod 600 ~/.ssh/mapserver-ec2.pem
          
          EXISTING=$(ssh -i ~/.ssh/mapserver-ec2.pem -o StrictHostKeyChecking=no -o ConnectTimeout=10             "$TILE_SERVER_SSH"             "find /data/tiles -name '${COUNTY}*' -name '*.mbtiles' -exec ls {} \;" 2>/dev/null || echo "")
          
          if [ -n "$EXISTING" ]; then
            echo "✅ Found existing mbtiles:"
            echo "$EXISTING"
            echo ""
            echo "⏩ Downloading from tile server (skipping EC2 generation)..."
            for f in $EXISTING; do
              scp -i ~/.ssh/mapserver-ec2.pem -o StrictHostKeyChecking=no                 "$TILE_SERVER_SSH:$f" /tmp/tiles/ 2>&1 || true
            done
            ls -lh /tmp/tiles/
            echo "SKIP_GENERATION=true" >> $GITHUB_ENV
          else
            echo "No existing tiles found — will generate from scratch"
          fi

      - name: Generate hillshades
        env:
          COUNTY: ${{ matrix.request.county }}
          DEM: ${{ matrix.request.dem }}
          STYLES: ${{ matrix.request.styles }}
          EXAGGERATIONS: ${{ matrix.request.exaggerations }}
          ZOOM: ${{ matrix.request.zoom }}
          ZOOMS: ${{ toJson(matrix.request.zooms) }}
          DISK_GB: ${{ matrix.request.disk }}
          SECURITY_GROUP: ${{ secrets.AWS_SECURITY_GROUP }}
          KEY_PAIR_NAME: ${{ secrets.AWS_KEY_PAIR_NAME }}
          IAM_INSTANCE_PROFILE: ${{ secrets.AWS_IAM_INSTANCE_PROFILE }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          STATUS_BUCKET: exaggeratedrelief
          WORKER_INSTANCE_TYPE: c7g.2xlarge
          DEBUG_KEEP_ALIVE: ${{ github.event.inputs.debug || 'false' }}
        run: |
          echo "🗺️  Generating hillshades for $COUNTY"

          # ── Status: init job ──────────────────────────────────────────
          echo '::group::Status tracking'
          JOB_ID="${COUNTY}-${STYLES}-${EXAGGERATIONS}x-z${ZOOM//[-]/-}"
          python3 -c "
          import sys; sys.path.insert(0, '.')
          from ilhmp.status import StatusTracker
          t = StatusTracker('exaggeratedrelief', '${{ github.run_id }}')
          t.init('${JOB_ID}', county='${COUNTY}', theme='${STYLES}', dem='${DEM}', zoom='${ZOOM}', exaggeration='${EXAGGERATIONS}', github_run_url='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}')
          t.update(status='provisioning', phase='provision_worker', percent=5, message='Launching EC2 worker')
          " || echo '::warning::Status init failed (non-fatal)'
          echo '::endgroup::'
          echo "   DEM: $DEM"
          echo "   Styles: $STYLES"
          echo "   Exaggerations: $EXAGGERATIONS"
          echo "   Zoom: $ZOOM"
          echo "   Disk: ${DISK_GB}GB"
          
          # Pre-flight disk size check
          # Estimate required disk: DEM download + extraction + hillshade + mbtiles + headroom
          # For z10-18 McHenry-sized counties, we need ~220GB. Default 200GB is too small.
          # Warn loudly if disk is likely insufficient for the requested zoom range.
          # Extract highest zoom from any format (10-16, 10-13,15,18, etc.)
          ZOOM_MAX=$(echo "$ZOOM" | tr ',' '\n' | tr '-' '\n' | grep -E '^[0-9]+$' | sort -n | tail -1)
          if [ "${ZOOM_MAX:-16}" -ge 17 ] && [ "${DISK_GB:-200}" -lt 250 ]; then
            echo "⚠️  WARNING: zoom max ${ZOOM_MAX} with ${DISK_GB}GB disk may be insufficient."
            echo "   Recommended: 300GB for z10-18. Set disk: 300 in request YAML."
          elif [ "${ZOOM_MAX:-16}" -ge 15 ] && [ "${DISK_GB:-200}" -lt 200 ]; then
            echo "⚠️  WARNING: zoom max ${ZOOM_MAX} with ${DISK_GB}GB disk may be tight."
          fi
          
          # Write SSH key
          mkdir -p ~/.ssh
          echo "${{ secrets.TILE_SERVER_SSH_KEY }}" > ~/.ssh/mapserver-ec2.pem
          chmod 600 ~/.ssh/mapserver-ec2.pem
          
          # Check if mbtiles already exist on tile server — skip generation if so
          mkdir -p /tmp/tiles
          EXISTING=$(ssh -i ~/.ssh/mapserver-ec2.pem -o StrictHostKeyChecking=no -o ConnectTimeout=10             "${{ secrets.TILE_SERVER_SSH }}"             "find /data/tiles -name '${COUNTY}*' -name '*.mbtiles' -exec ls {} \;" 2>/dev/null || echo "")
          
          if [ -n "$EXISTING" ]; then
            echo "✅ Found existing mbtiles on tile server:"
            echo "$EXISTING"
            echo "⏩ Skipping EC2 generation — downloading existing tiles"
            for f in $EXISTING; do
              scp -i ~/.ssh/mapserver-ec2.pem -o StrictHostKeyChecking=no                 "${{ secrets.TILE_SERVER_SSH }}:$f" /tmp/tiles/ 2>&1 || true
            done
            TILE_COUNT=$(ls /tmp/tiles/*.mbtiles 2>/dev/null | wc -l)
            echo "Downloaded $TILE_COUNT existing tile(s)"
            if [ "$TILE_COUNT" -gt 0 ]; then
              echo "SKIP_GENERATION=true" >> $GITHUB_ENV
              echo "✅ Skipping EC2 generation — tiles already on tile server"
              ls -lh /tmp/tiles/
              exit 0
            fi
          fi
          
          cd aws
          
          # Run the proven generate-aws.sh script
          ./generate-aws.sh "$COUNTY" \
            --dem "$DEM" \
            --style "$STYLES" \
            --exaggeration "$EXAGGERATIONS" \
            --zoom "$ZOOM" \
            --disk "${DISK_GB:-200}" 2>&1 | tee /tmp/generate-${COUNTY}.log
          
          # Extract worker info
          if [ -f "/tmp/hillshade-worker-${COUNTY}.env" ]; then
            source /tmp/hillshade-worker-${COUNTY}.env
            echo "Worker: $WORKER_IP ($WORKER_INSTANCE_ID)"
            echo ""
            echo "📡 Live logs (CloudWatch):" 
            echo "   aws logs tail /ilhmp/hillshade-gen --log-stream-name-prefix ${COUNTY}-${WORKER_INSTANCE_ID} --follow --region us-east-2"
            echo "   (stream name: ${COUNTY}-${WORKER_INSTANCE_ID})"
            echo ""
            
            # ── Status: worker launched ──────────────────────────────────────────
            python3 -c "
            import sys; sys.path.insert(0, '.')
            from ilhmp.status import StatusTracker
            t = StatusTracker('exaggeratedrelief', '${{ github.run_id }}')
            t.update(status='provisioning', phase='provision_worker', percent=10, message='Worker launched: ${WORKER_INSTANCE_ID} (${WORKER_IP})')
            " || true

            # Write startup manifest to S3 for tracking/cleanup
            RUN_ID="${COUNTY}-$(date +%Y%m%d-%H%M%S)"
            cat > /tmp/run-manifest.json << MANIFEST
          {
            "run_id": "${RUN_ID}",
            "county": "${COUNTY}",
            "dem": "${DEM}",
            "styles": "${STYLES}",
            "exaggerations": "${EXAGGERATIONS}",
            "zoom": "${ZOOM}",
            "debug": "${DEBUG_KEEP_ALIVE}",
            "instance_id": "${WORKER_INSTANCE_ID}",
            "instance_ip": "${WORKER_IP}",
            "instance_type": "${WORKER_INSTANCE_TYPE}",
            "github_run_id": "${{ github.run_id }}",
            "github_run_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "github_sha": "${{ github.sha }}",
            "github_ref": "${{ github.ref }}",
            "triggered_by": "${{ github.actor }}",
            "started_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "status": "running"
          }
          MANIFEST
            aws s3 cp /tmp/run-manifest.json s3://$S3_BUCKET/ci/runs/${RUN_ID}.json || true
            echo "📋 Run manifest: s3://$S3_BUCKET/ci/runs/${RUN_ID}.json"
          else
            echo "❌ Worker info not found, script may have failed"
            aws s3 cp /tmp/generate-${COUNTY}.log s3://$S3_BUCKET/ci/logs/${COUNTY}-failed-$(date +%Y%m%d-%H%M%S).log || true
            exit 1
          fi
          
          # Wait for SSH to be ready (key already at ~/.ssh/mapserver-ec2.pem)
          echo "⏳ Waiting for SSH access..."
          for i in {1..30}; do
            if ssh -i ~/.ssh/mapserver-ec2.pem -o StrictHostKeyChecking=no -o ConnectTimeout=5 \
                ubuntu@$WORKER_IP 'echo ready' 2>/dev/null; then
              echo "✅ SSH ready"
              break
            fi
            sleep 10
          done
          
          # Wait for worker to finish (poll every 2 min, max 2 hours)
          echo "⏳ Waiting for worker to complete generation..."
          MAX_ITERATIONS=60
          ITERATION=0
          
          while [ $ITERATION -lt $MAX_ITERATIONS ]; do
            ITERATION=$((ITERATION + 1))
            
            # Check if worker still exists
            WORKER_STATE=$(aws ec2 describe-instances \
              --instance-ids "$WORKER_INSTANCE_ID" \
              --query 'Reservations[0].Instances[0].State.Name' \
              --output text 2>/dev/null || echo "terminated")
            
            if [ "$WORKER_STATE" = "terminated" ]; then
              echo "✅ Worker terminated (generation complete or failed)"
              break
            fi
            
            # Collect progress stats via SSH
            echo "[$ITERATION/$MAX_ITERATIONS] Worker state: $WORKER_STATE"
            
            PROGRESS=$(ssh -i ~/.ssh/mapserver-ec2.pem -o StrictHostKeyChecking=no -o ConnectTimeout=10 ubuntu@$WORKER_IP '
              df -h /data | tail -1 | awk '"'"'{printf "   💾 Disk: %s (%s full)\n", $3, $5}'"'"'
              uptime | awk -F"load average:" '"'"'{print "   🖥️  CPU load:" $2}'"'"' | cut -d, -f1
              echo "   📦 Output: $(find /data/output -name "*.mbtiles" 2>/dev/null | wc -l) mbtiles ($(du -sh /data/output 2>/dev/null | cut -f1 || echo 0))"
              if [ -f /var/log/hillshade-gen.log ]; then
                echo "   📋 Latest: $(tail -1 /var/log/hillshade-gen.log 2>/dev/null | cut -c1-80)"
              fi
              [ -f /data/output/DONE ] && echo "DONE_FOUND"
            ' 2>/dev/null || echo "   (SSH failed)")
            
            echo "$PROGRESS"

            # ── Status: periodic update during polling ─────────────────────────────────
            if [ $((ITERATION % 10)) -eq 0 ]; then
              MBTILE_COUNT=$(echo "$PROGRESS" | grep -oP '\d+ mbtiles' | grep -oP '\d+' | head -1 || echo 0)
              # Rough percent: base 15 (running) + up to 65 more based on iteration
              GEN_PCT=$(( 15 + (ITERATION * 65 / MAX_ITERATIONS) ))
              python3 -c "
              import sys; sys.path.insert(0, '.')
              from ilhmp.status import StatusTracker
              t = StatusTracker('exaggeratedrelief', '${{ github.run_id }}')
              t.update(status='running', phase='generate_tiles', percent=${GEN_PCT}, message='Generating tiles z${ZOOM} · iteration ${ITERATION}/${MAX_ITERATIONS} · ${MBTILE_COUNT} mbtiles')
              " || true
            fi

            # Break if DONE marker found
            if echo "$PROGRESS" | grep -q "DONE_FOUND"; then
              echo "🎉 Generation complete!"
              break
            fi
            
            # Early abort if disk is critically full (>= 95%) with no mbtiles output yet
            DISK_PCT=$(echo "$PROGRESS" | grep -oP '\d+(?=% full)' | head -1 || echo "0")
            if [ "${DISK_PCT:-0}" -ge 95 ] && ! echo "$PROGRESS" | grep -q '1 mbtiles'; then
              echo "🚨 DISK CRITICAL: ${DISK_PCT}% full with no output mbtiles — aborting early"
              echo "   This indicates the disk is too small for this county+zoom combination."
              echo "   Fix: add 'disk: 300' (or higher) to the request YAML and retry."
              aws ec2 terminate-instances --instance-ids "$WORKER_INSTANCE_ID" --region us-east-2 || true
              exit 1
            fi
            
            sleep 120
          done
          
          if [ $ITERATION -ge $MAX_ITERATIONS ]; then
            echo "⚠️  Timeout after 2 hours"
            if [ "$DEBUG_KEEP_ALIVE" = "true" ]; then
              echo "🔧 DEBUG: Keeping worker alive for troubleshooting"
              echo "   SSH: ssh -i ~/.ssh/mapserver-ec2.pem ubuntu@$WORKER_IP"
            else
              echo "Terminating worker..."
              aws ec2 terminate-instances --instance-ids "$WORKER_INSTANCE_ID" --region us-east-2 || true
            fi
          fi
          
          # Download tiles from worker via SCP
          echo "📥 Downloading tiles from worker..."
          mkdir -p /tmp/tiles
          
          # List what's on the worker
          ssh -i ~/.ssh/mapserver-ec2.pem -o StrictHostKeyChecking=no ubuntu@$WORKER_IP \
            'find /data/output -name "*.mbtiles" -exec ls -lh {} \;' 2>/dev/null || true
          
          # SCP all mbtiles
          scp -i ~/.ssh/mapserver-ec2.pem -o StrictHostKeyChecking=no \
            "ubuntu@$WORKER_IP:/data/output/${COUNTY}/*/*.mbtiles" /tmp/tiles/ 2>&1 || true
          
          TILE_COUNT=$(ls /tmp/tiles/*.mbtiles 2>/dev/null | wc -l)
          if [ "$TILE_COUNT" -eq 0 ]; then
            echo "❌ No tiles found on worker"
            # Try broader search
            scp -i ~/.ssh/mapserver-ec2.pem -o StrictHostKeyChecking=no \
              "ubuntu@$WORKER_IP:/data/output/*.mbtiles" /tmp/tiles/ 2>&1 || true
            TILE_COUNT=$(ls /tmp/tiles/*.mbtiles 2>/dev/null | wc -l)
          fi
          
          if [ "$TILE_COUNT" -eq 0 ]; then
            echo "❌ Still no tiles found. Checking worker output structure:"
            ssh -i ~/.ssh/mapserver-ec2.pem -o StrictHostKeyChecking=no ubuntu@$WORKER_IP \
              'find /data/output -type f 2>/dev/null | head -30' || true
            # Grab full worker logs for debugging
            ssh -i ~/.ssh/mapserver-ec2.pem -o StrictHostKeyChecking=no ubuntu@$WORKER_IP \
              'cat /var/log/hillshade-gen.log 2>/dev/null' > /tmp/worker-hillshade-gen.log 2>/dev/null || true
            aws s3 cp /tmp/generate-${COUNTY}.log s3://$S3_BUCKET/ci/logs/${COUNTY}-failed-$(date +%Y%m%d-%H%M%S).log || true
            aws s3 cp /tmp/worker-hillshade-gen.log s3://$S3_BUCKET/ci/logs/${COUNTY}-worker-$(date +%Y%m%d-%H%M%S).log 2>/dev/null || true
            if [ "$DEBUG_KEEP_ALIVE" = "true" ]; then
              echo "🔧 DEBUG: Worker kept alive at $WORKER_IP for troubleshooting"
              echo "   ssh -i ~/.ssh/mapserver-ec2.pem ubuntu@$WORKER_IP"
              echo "   ⚠️  Terminate when done: aws ec2 terminate-instances --instance-ids $WORKER_INSTANCE_ID --region us-east-2"
            else
              aws ec2 terminate-instances --instance-ids "$WORKER_INSTANCE_ID" --region us-east-2 || true
            fi
            exit 1
          fi
          
          echo "✅ Downloaded $TILE_COUNT tile(s):"
          ls -lh /tmp/tiles/

          # ── Status: tiles downloaded, starting upload phase ─────────────────────────
          python3 -c "
          import sys; sys.path.insert(0, '.')
          from ilhmp.status import StatusTracker
          t = StatusTracker('exaggeratedrelief', '${{ github.run_id }}')
          t.update(status='uploading', phase='upload_artifacts', percent=85, message='Uploading ${TILE_COUNT} tile(s) to tile server')
          " || true

          # Upload success log to S3
          aws s3 cp /tmp/generate-${COUNTY}.log \
            s3://$S3_BUCKET/ci/logs/${COUNTY}-success-$(date +%Y%m%d-%H%M%S).log

          echo "✅ Generation complete for $COUNTY"
      
      - name: Upload to tile server
        if: success() && env.SKIP_GENERATION != 'true'
        env:
          TILE_SERVER_SSH: ${{ secrets.TILE_SERVER_SSH }}
        run: |
          # Setup SSH key
          mkdir -p ~/.ssh
          echo "${{ secrets.TILE_SERVER_SSH_KEY }}" > ~/.ssh/tile-server.pem
          chmod 600 ~/.ssh/tile-server.pem
          
          # Upload each tile
          for mbtiles in /tmp/tiles/*.mbtiles; do
            if [ -f "$mbtiles" ]; then
              basename=$(basename "$mbtiles")
              echo "Uploading $basename..."
              scp -i ~/.ssh/tile-server.pem -o StrictHostKeyChecking=no \
                "$mbtiles" "$TILE_SERVER_SSH:/data/tiles/"
            fi
          done
          
          # Restart mbtileserver
          ssh -i ~/.ssh/tile-server.pem -o StrictHostKeyChecking=no \
            "$TILE_SERVER_SSH" 'cd /data && sudo docker compose restart mbtileserver'
          
          echo "✅ Tiles deployed to tile server"

      - name: Convert to PMTiles and publish to exaggeratedrelief.com
        if: success()
        env:
          COUNTY: ${{ matrix.request.county }}
          STYLES: ${{ matrix.request.styles }}
          EXAGGERATIONS: ${{ matrix.request.exaggerations }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          # Install pmtiles CLI
          PMTILES_VERSION="1.30.2"
          wget -q "https://github.com/protomaps/go-pmtiles/releases/download/v${PMTILES_VERSION}/go-pmtiles_${PMTILES_VERSION}_Linux_x86_64.tar.gz" -O /tmp/pmtiles.tar.gz
          tar -xzf /tmp/pmtiles.tar.gz -C /usr/local/bin/
          chmod +x /usr/local/bin/pmtiles
          pmtiles --version || echo 'pmtiles installed'
          
          # Convert each mbtiles to pmtiles — name from actual mbtiles base, not request aggregate
          mkdir -p /tmp/pmtiles
          for mbtiles in /tmp/tiles/*.mbtiles; do
            if [ -f "$mbtiles" ]; then
              base=$(basename "$mbtiles" .mbtiles)
              pmname="${base}.pmtiles"
              echo "Converting $base -> $pmname"
              pmtiles convert "$mbtiles" "/tmp/pmtiles/$pmname"
            fi
          done
          
          # Upload pmtiles to exaggeratedrelief S3 bucket
          for pm in /tmp/pmtiles/*.pmtiles; do
            if [ -f "$pm" ]; then
              echo "Uploading $(basename $pm) to S3..."
              aws s3 cp "$pm" "s3://exaggeratedrelief/tiles/$(basename $pm)" \
                --content-type "application/octet-stream"
            fi
          done
          
          # ── Status: pmtiles packaged ───────────────────────────────────────────
          PM_FILES=$(ls /tmp/pmtiles/*.pmtiles 2>/dev/null | xargs -I{} basename {} | tr '\n' ',' | sed 's/,$//')
          PM_COUNT=$(ls /tmp/pmtiles/*.pmtiles 2>/dev/null | wc -l)
          python3 -c "
          import sys; sys.path.insert(0, '.')
          from ilhmp.status import StatusTracker
          t = StatusTracker('exaggeratedrelief', '${{ github.run_id }}')
          t.update(status='uploading', phase='package_pmtiles', percent=90, message=f'PMTiles published: ${PM_COUNT} file(s): ${PM_FILES}')
          " || true

          echo "✅ PMTiles published to exaggeratedrelief.com"

      - name: Update catalog.json
        if: success()
        env:
          COUNTY: ${{ matrix.request.county }}
          STYLES: ${{ matrix.request.styles }}
          EXAGGERATIONS: ${{ matrix.request.exaggerations }}
          DEM: ${{ matrix.request.dem }}
        run: |
          pip install pyyaml
          # Download current catalog, add new tile entry, re-upload
          aws s3 cp s3://exaggeratedrelief/catalog.json /tmp/catalog.json || echo '{}' > /tmp/catalog.json
          
          python3 << 'EOF'
          import json, os, glob, re

          county = os.environ['COUNTY']
          dem = os.environ.get('DEM', 'dtm')
          zoom_env = os.environ.get('ZOOM', '10-16')

          with open('/tmp/catalog.json') as f:
              catalog = json.load(f)

          if county not in catalog.get('counties', {}):
              print(f"Warning: {county} not in catalog, skipping")
              exit(0)

          # Parse zoom list from ZOOM env (handles "10-16" and "10-13,15,18")
          def parse_zoom(z):
              zooms = set()
              for part in z.split(','):
                  part = part.strip()
                  if '-' in part:
                      lo, hi = part.split('-', 1)
                      zooms.update(range(int(lo), int(hi)+1))
                  elif part:
                      zooms.add(int(part))
              return sorted(zooms)

          zoom_list = parse_zoom(zoom_env)

          # One catalog entry per actual pmtiles file
          new_entries = []
          for pmpath in sorted(glob.glob('/tmp/pmtiles/*.pmtiles')):
              pmname = os.path.basename(pmpath)
              base = pmname[:-len('.pmtiles')]        # e.g. putnam-cool-elevation-autox
              size_mb = int(os.path.getsize(pmpath) / 1024 / 1024)

              # Try to extract theme/exag from filename: {county}-{theme}-{exag}
              # Strip leading "{county}-" and trailing "-{exag}x" or "-autox"
              inner = base[len(county)+1:] if base.startswith(county+'-') else base
              exag_match = re.search(r'-(\d+x|autox)$', inner)
              if exag_match:
                  theme = inner[:exag_match.start()]
                  exag = exag_match.group(1)
              else:
                  theme = inner
                  exag = 'auto'

              new_entries.append({
                  "id": base,
                  "theme": theme,
                  "dem": dem,
                  "exaggeration": exag,
                  "zooms": zoom_list,
                  "pmtiles": f"tiles/{pmname}",
                  "pmtiles_size_mb": size_mb,
                  "generated_at": os.environ.get('GITHUB_RUN_STARTED_AT', ''),
              })

          tiles = catalog['counties'][county].get('tiles', [])
          new_ids = {e['id'] for e in new_entries}
          tiles = [t for t in tiles if t.get('id') not in new_ids]
          tiles.extend(new_entries)
          catalog['counties'][county]['tiles'] = tiles

          with open('/tmp/catalog.json', 'w') as f:
              json.dump(catalog, f, indent=2)

          total = sum(len(c.get('tiles', [])) for c in catalog['counties'].values())
          print(f"Catalog updated: {county} now has {len(tiles)} tile(s) ({len(new_entries)} new/updated), {total} total")
          EOF
          
          aws s3 cp /tmp/catalog.json s3://exaggeratedrelief/catalog.json \
            --content-type "application/json" --cache-control "max-age=60"
          
          # Invalidate CloudFront cache for catalog
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Aliases.Items[0]=='exaggeratedrelief.com'].Id" \
            --output text 2>/dev/null || echo "")
          if [ -n "$DIST_ID" ]; then
            aws cloudfront create-invalidation --distribution-id "$DIST_ID" \
              --paths "/catalog.json" > /dev/null 2>&1 || true
          fi
          
          # ── Status: catalog updated ─────────────────────────────────────────
          python3 -c "
          import sys; sys.path.insert(0, '.')
          from ilhmp.status import StatusTracker
          t = StatusTracker('exaggeratedrelief', '${{ github.run_id }}')
          t.update(status='running', phase='update_catalog', percent=95, message='Catalog updated')
          " || true

          echo "✅ Catalog updated on exaggeratedrelief.com"
      
      - name: Mark as completed
        if: success()
        run: |
          python3 << 'EOF'
          import yaml, os, glob, sys
          sys.path.insert(0, '.')
          
          county = os.environ['COUNTY']
          styles = os.environ.get('STYLES', '')
          exags  = os.environ.get('EXAGGERATIONS', '')
          request_file = os.environ.get('REQUEST_FILE', '')
          
          # Find the request file
          if request_file and os.path.exists(request_file):
              target = request_file
          else:
              # Fallback: find by county name
              candidates = glob.glob(f'requests/{county}-*.yaml')
              target = candidates[0] if candidates else None
          
          if target:
              with open(target) as f:
                  data = yaml.safe_load(f)
              data['status'] = 'completed'
              data['generated_at'] = os.environ.get('GITHUB_RUN_STARTED_AT', '')
              data['github_run'] = os.environ.get('GITHUB_RUN_URL', '')
              with open(target, 'w') as f:
                  yaml.dump(data, f, default_flow_style=False, sort_keys=False)
              print(f"Marked {target} as completed")
          else:
              print(f"Warning: could not find request file for {county}")
          
          # ── Status: mark complete ──────────────────────────────────────────
          try:
              from ilhmp.status import StatusTracker
              pmtiles_name = f"{county}-{styles}-{exags}x.pmtiles"
              pmtiles_url  = f"https://exaggeratedrelief.s3.us-east-2.amazonaws.com/tiles/{pmtiles_name}"
              t = StatusTracker('exaggeratedrelief', os.environ.get('GITHUB_RUN_ID'))
              rec = t.complete(outputs={
                  'pmtiles_url': pmtiles_url,
                  'pmtiles_name': pmtiles_name,
                  'github_run_url': os.environ.get('GITHUB_RUN_URL', ''),
              })
              t.write_github_summary(rec)
              print("Status marked complete")
          except Exception as e:
              print(f"Warning: status complete failed (non-fatal): {e}")
          EOF
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add requests/
          git commit -m "Mark ${{ matrix.request.county }} as completed [skip ci]" || true
          
          # Retry push with rebase to handle concurrent commits
          for attempt in 1 2 3; do
            if git push; then
              echo "✅ Push succeeded (attempt $attempt)"
              break
            fi
            echo "⚠️  Push failed (attempt $attempt), rebasing..."
            git pull --rebase origin main || true
            # Re-apply status change in case rebase overwrote it
            python3 -c "
          import yaml, os, glob
          request_file = os.environ.get('REQUEST_FILE', '')
          county = os.environ.get('COUNTY', '')
          target = request_file if request_file and os.path.exists(request_file) else (glob.glob(f'requests/{county}-*.yaml') or [None])[0]
          if target:
              with open(target) as f:
                  data = yaml.safe_load(f)
              if data.get('status') != 'completed':
                  data['status'] = 'completed'
                  data['generated_at'] = os.environ.get('GITHUB_RUN_STARTED_AT', '')
                  data['github_run'] = os.environ.get('GITHUB_RUN_URL', '')
                  with open(target, 'w') as f:
                      yaml.dump(data, f, default_flow_style=False, sort_keys=False)
                  os.system('git add requests/')
                  os.system('git commit --amend --no-edit')
          " || true
          done
        env:
          COUNTY: ${{ matrix.request.county }}
          STYLES: ${{ matrix.request.styles }}
          EXAGGERATIONS: ${{ matrix.request.exaggerations }}
          REQUEST_FILE: ${{ matrix.request.request_file }}
          GITHUB_RUN_STARTED_AT: ${{ github.event.head_commit.timestamp }}
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Report failure status
        if: failure()
        env:
          COUNTY: ${{ matrix.request.county }}
          STYLES: ${{ matrix.request.styles }}
          EXAGGERATIONS: ${{ matrix.request.exaggerations }}
        run: |
          python3 -c "
          import sys; sys.path.insert(0, '.')
          try:
              from ilhmp.status import StatusTracker
              t = StatusTracker('exaggeratedrelief', '${{ github.run_id }}')
              rec = t.fail(
                  phase='generate_tiles',
                  error='GitHub Actions step failed. See run logs for details.',
                  next_action='Check logs at ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
              )
              t.write_github_summary(rec)
          except Exception as e:
              print(f'Status fail report failed (non-fatal): {e}')
          " || true


