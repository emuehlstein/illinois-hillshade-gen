name: Deploy Web UI

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Ensure status/ prefix is publicly readable
        run: |
          POLICY=$(aws s3api get-bucket-policy --bucket exaggeratedrelief \
            --query Policy --output text 2>/dev/null || echo '{"Version":"2012-10-17","Statement":[]}')
          echo "$POLICY" | python3 -c "
import json,subprocess,sys
policy=json.loads(sys.stdin.read())
stmts=policy.get('Statement',[])
if any('status' in str(s.get('Resource','')) and s.get('Effect')=='Allow' for s in stmts):
    print('status/* already public'); sys.exit(0)
stmts.append({'Sid':'PublicReadStatus','Effect':'Allow','Principal':'*',
              'Action':'s3:GetObject','Resource':'arn:aws:s3:::exaggeratedrelief/status/*'})
policy['Statement']=stmts
r=subprocess.run(['aws','s3api','put-bucket-policy','--bucket','exaggeratedrelief',
                  '--policy',json.dumps(policy)],capture_output=True,text=True)
if r.returncode==0: print('Added PublicReadStatus to bucket policy')
else: print(r.stderr,file=sys.stderr); sys.exit(1)
"

      - name: Deploy web files to S3
        run: |
          aws s3 cp web/app.js s3://exaggeratedrelief/app.js \
            --cache-control "no-cache" --content-type "application/javascript"
          aws s3 cp web/index.html s3://exaggeratedrelief/index.html \
            --cache-control "no-cache" --content-type "text/html"
          aws s3 cp web/status.html s3://exaggeratedrelief/status.html \
            --cache-control "no-cache" --content-type "text/html"
          echo "✅ Web files uploaded to S3"

      - name: Invalidate CloudFront cache
        run: |
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?contains(Aliases.Items, 'exaggeratedrelief.com')].Id" \
            --output text 2>/dev/null || echo "")
          if [ -n "$DIST_ID" ]; then
            echo "Invalidating CloudFront distribution $DIST_ID..."
            aws cloudfront create-invalidation \
              --distribution-id "$DIST_ID" \
              --paths "/app.js" "/index.html" "/status.html"
            echo "✅ CloudFront cache invalidated"
          else
            echo "⚠️  No CloudFront distribution found — S3 is authoritative, propagation depends on TTL"
          fi
