<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Exaggerated Relief — Illinois Terrain Atlas</title>
    <meta name="description" content="A growing terrain archive of Illinois — hillshade tiles generated from ISGS LiDAR, served via PMTiles. Click any county to view, download, or generate." />
    <link rel="preconnect" href="https://exaggeratedrelief.s3.us-east-2.amazonaws.com" crossorigin />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" />
    <style>
        :root {
            --bg: #07090d;
            --bg-elev: #0e1219;
            --panel: rgba(14, 18, 25, 0.78);
            --panel-border: rgba(255, 255, 255, 0.07);
            --panel-border-strong: rgba(255, 255, 255, 0.14);
            --ink: #e8edf3;
            --ink-soft: #9aa5b2;
            --ink-faint: #5e6975;
            --accent: #6aa9ff;
            --accent-soft: rgba(106, 169, 255, 0.18);

            /* status colors — subdued, terrain-friendly */
            --st-available:  #4f8a64;
            --st-partial:    #c79744;
            --st-generating: #6aa9ff;
            --st-failed:     #c8584d;
            --st-missing:    #2a313a;

            --st-available-glow:  rgba(79, 138, 100, 0.45);
            --st-partial-glow:    rgba(199, 151, 68, 0.45);
            --st-generating-glow: rgba(106, 169, 255, 0.55);
            --st-failed-glow:     rgba(200, 88, 77, 0.45);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            background: var(--bg);
            color: var(--ink);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            font-feature-settings: 'cv11', 'ss01';
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        a { color: inherit; text-decoration: none; }

        /* ── Map: the hero ─────────────────────────────────────── */
        #map {
            position: fixed;
            inset: 0;
            z-index: 0;
        }
        #map .maplibregl-ctrl-bottom-right { bottom: 8px !important; right: 8px !important; }
        #map .maplibregl-ctrl-attrib {
            font-size: 9px !important;
            background: rgba(7, 9, 13, 0.6) !important;
            color: var(--ink-faint) !important;
        }
        #map .maplibregl-ctrl-attrib a { color: var(--ink-soft) !important; }

        /* ── Top bar ───────────────────────────────────────────── */
        .topbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 10;
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            background: linear-gradient(to bottom, rgba(7, 9, 13, 0.65), transparent);
        }
        .topbar > * { pointer-events: auto; }

        .brand {
            display: flex;
            align-items: baseline;
            gap: 10px;
            letter-spacing: -0.01em;
        }
        .brand .mark {
            font-size: 17px;
            font-weight: 600;
            color: var(--ink);
        }
        .brand .mark .em { color: var(--accent); font-weight: 500; }
        .brand .tag {
            font-size: 11px;
            color: var(--ink-faint);
            font-weight: 400;
            letter-spacing: 0.02em;
        }
        @media (max-width: 640px) { .brand .tag { display: none; } }

        .topbar-actions { display: flex; gap: 6px; }
        .topbar-actions a, .topbar-actions button {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 500;
            color: var(--ink-soft);
            background: rgba(14, 18, 25, 0.6);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: color 0.2s, background 0.2s, border-color 0.2s;
            cursor: pointer;
            font-family: inherit;
        }
        .topbar-actions a:hover, .topbar-actions button:hover {
            color: var(--ink);
            background: rgba(20, 26, 36, 0.85);
            border-color: var(--panel-border-strong);
        }
        .topbar-actions svg { width: 13px; height: 13px; flex-shrink: 0; }

        /* ── Status legend (bottom-left) ───────────────────────── */
        .legend {
            position: fixed;
            left: 24px;
            bottom: 24px;
            z-index: 8;
            padding: 14px 16px;
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            min-width: 180px;
        }
        .legend-title {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--ink-faint);
            margin-bottom: 10px;
            font-weight: 600;
        }
        .legend-items {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }
        .legend-row {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 12px;
            color: var(--ink-soft);
            cursor: default;
        }
        .legend-row .count {
            margin-left: auto;
            font-variant-numeric: tabular-nums;
            color: var(--ink-faint);
            font-size: 11px;
        }
        .legend-swatch {
            width: 10px;
            height: 10px;
            border-radius: 3px;
            flex-shrink: 0;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.06);
        }

        /* Animation for generating state */
        @keyframes pulse-soft {
            0%, 100% { opacity: 0.55; }
            50% { opacity: 1; }
        }
        .legend-swatch.generating {
            animation: pulse-soft 1.8s ease-in-out infinite;
        }

        /* ── Coverage stats (bottom-right) ─────────────────────── */
        .coverage {
            position: fixed;
            right: 24px;
            bottom: 24px;
            z-index: 7;
            padding: 14px 18px;
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 160px;
        }
        .coverage-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
            justify-content: space-between;
        }
        .coverage-row .num {
            font-size: 18px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            color: var(--ink);
        }
        .coverage-row .lbl {
            font-size: 11px;
            color: var(--ink-faint);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .coverage-bar {
            height: 4px;
            background: rgba(255,255,255,0.06);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 4px;
            display: flex;
        }
        .coverage-bar > div {
            height: 100%;
            transition: width 0.6s ease;
        }
        @media (max-width: 640px) {
            .coverage { right: 12px; bottom: 12px; min-width: 130px; padding: 10px 14px; }
            .legend { left: 12px; bottom: 12px; min-width: 150px; padding: 10px 12px; }
            .legend-row { font-size: 11px; }
        }

        /* ── Hover tooltip ─────────────────────────────────────── */
        .hover-tip {
            position: fixed;
            z-index: 12;
            padding: 8px 12px;
            background: rgba(7, 9, 13, 0.92);
            border: 1px solid var(--panel-border-strong);
            border-radius: 8px;
            font-size: 12px;
            color: var(--ink);
            pointer-events: none;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transform: translate(-50%, -100%);
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.12s ease;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
        }
        .hover-tip.show { opacity: 1; }
        .hover-tip .name {
            font-weight: 600;
            letter-spacing: -0.01em;
        }
        .hover-tip .status {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-left: 8px;
            color: var(--ink-soft);
            font-size: 11px;
            text-transform: lowercase;
        }
        .hover-tip .status-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
        }

        /* ── Drawer (floating right panel) ─────────────────────── */
        .drawer {
            position: fixed;
            top: 80px;
            right: 20px;
            bottom: 80px;
            width: 380px;
            max-width: calc(100vw - 40px);
            z-index: 9;
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transform: translateX(calc(100% + 32px));
            opacity: 0;
            transition: transform 0.32s cubic-bezier(0.32, 0.72, 0.27, 0.99), opacity 0.2s;
            pointer-events: none;
        }
        .drawer.open {
            transform: translateX(0);
            opacity: 1;
            pointer-events: auto;
        }

        .drawer-head {
            padding: 18px 20px 14px;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
        }
        .drawer-head .title {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.02em;
            line-height: 1.1;
        }
        .drawer-head .subtitle {
            font-size: 11px;
            color: var(--ink-faint);
            margin-top: 4px;
            letter-spacing: 0.04em;
        }
        .drawer-close {
            background: none;
            border: none;
            color: var(--ink-faint);
            cursor: pointer;
            width: 28px; height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s, background 0.15s;
            flex-shrink: 0;
        }
        .drawer-close:hover { color: var(--ink); background: rgba(255,255,255,0.04); }

        .drawer-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px 20px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.1) transparent;
        }
        .drawer-body::-webkit-scrollbar { width: 6px; }
        .drawer-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            border: 1px solid;
        }
        .status-pill .dot {
            width: 7px; height: 7px;
            border-radius: 50%;
        }
        .status-pill.available  { color: var(--st-available);  background: rgba(79, 138, 100, 0.12);  border-color: rgba(79, 138, 100, 0.35); }
        .status-pill.partial    { color: var(--st-partial);    background: rgba(199, 151, 68, 0.12); border-color: rgba(199, 151, 68, 0.35); }
        .status-pill.generating { color: var(--st-generating); background: rgba(106, 169, 255, 0.12); border-color: rgba(106, 169, 255, 0.35); }
        .status-pill.failed     { color: var(--st-failed);     background: rgba(200, 88, 77, 0.12);  border-color: rgba(200, 88, 77, 0.35); }
        .status-pill.missing    { color: var(--ink-soft);      background: rgba(255, 255, 255, 0.04); border-color: rgba(255, 255, 255, 0.12); }
        .status-pill.available .dot  { background: var(--st-available); }
        .status-pill.partial .dot    { background: var(--st-partial); }
        .status-pill.generating .dot { background: var(--st-generating); animation: pulse-soft 1.8s ease-in-out infinite; }
        .status-pill.failed .dot     { background: var(--st-failed); }
        .status-pill.missing .dot    { background: var(--ink-faint); }

        .section-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--ink-faint);
            margin: 18px 0 8px;
            font-weight: 600;
        }
        .section-label:first-child { margin-top: 4px; }

        .meta-grid {
            display: grid;
            grid-template-columns: max-content 1fr;
            gap: 6px 14px;
            font-size: 13px;
        }
        .meta-grid .k { color: var(--ink-faint); white-space: nowrap; }
        .meta-grid .v { color: var(--ink); font-variant-numeric: tabular-nums; }

        .theme-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }
        .theme-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            color: var(--ink-soft);
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--panel-border);
            cursor: pointer;
            transition: all 0.15s;
        }
        .theme-chip:hover {
            color: var(--ink);
            background: rgba(106, 169, 255, 0.08);
            border-color: rgba(106, 169, 255, 0.3);
        }
        .theme-chip.active {
            color: var(--ink);
            background: var(--accent-soft);
            border-color: rgba(106, 169, 255, 0.5);
        }
        .theme-chip .dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--st-available);
        }

        .preview-thumb {
            width: 100%;
            height: 140px;
            border-radius: 10px;
            background: #0a0d12;
            border: 1px solid var(--panel-border);
            overflow: hidden;
            margin-top: 4px;
            position: relative;
        }
        .preview-thumb .ph {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ink-faint);
            font-size: 11px;
            letter-spacing: 0.05em;
        }
        .preview-thumb .mini-map {
            width: 100%;
            height: 100%;
        }

        .action-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 16px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.18s;
            text-decoration: none;
            width: 100%;
        }
        .btn svg { width: 14px; height: 14px; }
        .btn-primary {
            background: var(--accent);
            color: #0a0d12;
            border-color: var(--accent);
        }
        .btn-primary:hover {
            background: #84baff;
            border-color: #84baff;
            box-shadow: 0 4px 16px rgba(106, 169, 255, 0.25);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.04);
            color: var(--ink);
            border-color: var(--panel-border-strong);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .btn-ghost {
            background: transparent;
            color: var(--ink-soft);
            border-color: var(--panel-border);
        }
        .btn-ghost:hover { color: var(--ink); border-color: var(--panel-border-strong); }

        .btn-generate {
            background: rgba(79, 138, 100, 0.12);
            color: var(--st-available);
            border-color: rgba(79, 138, 100, 0.35);
            font-weight: 600;
        }
        .btn-generate:hover {
            background: rgba(79, 138, 100, 0.2);
            border-color: rgba(79, 138, 100, 0.55);
            box-shadow: 0 4px 20px rgba(79, 138, 100, 0.2);
        }

        .progress {
            margin-top: 10px;
            padding: 12px;
            border-radius: 10px;
            background: rgba(106, 169, 255, 0.06);
            border: 1px solid rgba(106, 169, 255, 0.2);
        }
        .progress .label {
            font-size: 11px;
            color: var(--accent);
            font-weight: 600;
            letter-spacing: 0.05em;
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .progress .bar {
            height: 4px;
            background: rgba(255,255,255,0.06);
            border-radius: 4px;
            overflow: hidden;
        }
        .progress .bar > div {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), #84baff);
            border-radius: 4px;
            transition: width 0.6s ease;
        }
        .progress .phase {
            font-size: 11px;
            color: var(--ink-soft);
            margin-top: 6px;
            font-family: 'SF Mono', Menlo, monospace;
        }

        .failure-msg {
            margin-top: 10px;
            padding: 12px;
            border-radius: 10px;
            background: rgba(200, 88, 77, 0.06);
            border: 1px solid rgba(200, 88, 77, 0.25);
            font-size: 12px;
            color: var(--ink-soft);
        }
        .failure-msg .head {
            color: var(--st-failed);
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .missing-hint {
            margin-top: 4px;
            font-size: 12px;
            color: var(--ink-soft);
            line-height: 1.55;
        }
        .est-row {
            display: flex;
            gap: 14px;
            margin-top: 10px;
            font-size: 11px;
            color: var(--ink-faint);
        }
        .est-row .est {
            display: flex;
            gap: 4px;
            align-items: baseline;
        }
        .est-row .est strong { color: var(--ink); font-weight: 600; }

        /* mobile: drawer becomes bottom sheet */
        @media (max-width: 700px) {
            .drawer {
                top: auto;
                right: 0;
                left: 0;
                bottom: 0;
                width: 100%;
                max-width: 100%;
                max-height: 75vh;
                border-radius: 16px 16px 0 0;
                transform: translateY(100%);
            }
            .drawer.open {
                transform: translateY(0);
            }
            .topbar { padding: 12px 16px; }
        }

        /* ── Loading overlay ─────────────────────────────────── */
        #boot {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            transition: opacity 0.3s;
        }
        #boot.gone { opacity: 0; pointer-events: none; }
        #boot .spinner {
            width: 28px; height: 28px;
            border: 2px solid rgba(255,255,255,0.08);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        #boot .label {
            font-size: 12px;
            letter-spacing: 0.06em;
            color: var(--ink-faint);
            text-transform: uppercase;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* utilities */
        .hidden { display: none !important; }
        .nowrap { white-space: nowrap; }
    </style>
</head>
<body>

    <div id="boot">
        <div class="spinner"></div>
        <div class="label">Charting Illinois…</div>
    </div>

    <div id="map"></div>

    <header class="topbar">
        <div class="brand">
            <div class="mark"><span class="em">Exaggerated</span> Relief</div>
            <div class="tag">Illinois LiDAR terrain atlas</div>
        </div>
        <nav class="topbar-actions">
            <a href="/status.html" title="Pipeline status">
                <svg viewBox="0 0 16 16" fill="currentColor"><path d="M1 8a7 7 0 1 1 14 0A7 7 0 0 1 1 8zm7-5.5a.5.5 0 0 0-1 0V8a.5.5 0 0 0 .2.4l3.2 2.4a.5.5 0 1 0 .6-.8L8 7.75V2.5z"/></svg>
                Pipeline
            </a>
            <a href="/configurator.html" title="Advanced configurator">
                <svg viewBox="0 0 16 16" fill="currentColor"><path d="M14 7v2h-3.6a3 3 0 0 1-5.8 0H2V7h2.6a3 3 0 0 1 5.8 0H14zM8 6.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/></svg>
                Configure
            </a>
            <a href="https://github.com/emuehlstein/illinois-hillshade-gen" target="_blank" rel="noopener" title="Source on GitHub">
                <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
                GitHub
            </a>
        </nav>
    </header>

    <!-- Legend -->
    <aside class="legend" id="legend">
        <div class="legend-title">Coverage Status</div>
        <div class="legend-items" id="legend-items">
            <!-- populated by JS -->
        </div>
    </aside>

    <!-- Coverage stats -->
    <aside class="coverage" id="coverage">
        <div class="coverage-row">
            <span class="num" id="cov-num">—</span>
            <span class="lbl">of 102 counties</span>
        </div>
        <div class="coverage-bar" id="cov-bar"></div>
    </aside>

    <!-- Zoom indicator -->
    <div id="zoom-badge" style="
        position: fixed;
        bottom: 28px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 8;
        padding: 4px 10px;
        background: rgba(7, 9, 13, 0.55);
        border: 1px solid rgba(255,255,255,0.07);
        border-radius: 999px;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        color: rgba(154, 165, 178, 0.75);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        pointer-events: none;
        letter-spacing: 0.04em;
    ">z<span id="zoom-val">—</span></div>

    <!-- Hover tooltip -->
    <div class="hover-tip" id="hover-tip">
        <span class="name"></span>
        <span class="status"><span class="status-dot"></span><span class="status-text"></span></span>
    </div>

    <!-- Drawer -->
    <aside class="drawer" id="drawer" aria-hidden="true">
        <header class="drawer-head">
            <div>
                <div class="title" id="drawer-title">—</div>
                <div class="subtitle" id="drawer-subtitle">—</div>
            </div>
            <button class="drawer-close" id="drawer-close" aria-label="Close">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M3.3 2.3a1 1 0 0 0-1.4 1.4L6.6 8l-4.7 4.3a1 1 0 1 0 1.4 1.4L8 9.4l4.3 4.3a1 1 0 0 0 1.4-1.4L9.4 8l4.3-4.3a1 1 0 0 0-1.4-1.4L8 6.6 3.3 2.3z"/></svg>
            </button>
        </header>
        <div class="drawer-body" id="drawer-body">
            <!-- populated by renderDrawer -->
        </div>
    </aside>

    <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/pmtiles@4.4.0/dist/pmtiles.js"></script>
    <script src="atlas.js"></script>
</body>
