<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Exaggerated Relief — Illinois Hillshade Maps</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            overflow: hidden;
        }
        #map {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
        }

        /* Header bar */
        .header {
            position: absolute;
            top: 0; left: 0; right: 0;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(13,17,23,0.95), rgba(13,17,23,0));
            padding: 16px 24px 40px;
            pointer-events: none;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.02em;
            pointer-events: auto;
        }
        .header h1 span { color: #58a6ff; }
        .header .subtitle {
            font-size: 13px;
            color: #8b949e;
            margin-top: 2px;
        }

        /* Controls panel */
        .controls {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .control-group {
            background: rgba(13,17,23,0.9);
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px;
            backdrop-filter: blur(8px);
            min-width: 180px;
        }
        .control-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #8b949e;
            margin-bottom: 6px;
        }
        .control-group select, .control-group input {
            width: 100%;
            background: #161b22;
            border: 1px solid #30363d;
            color: #e6edf3;
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 13px;
        }
        .control-group select:focus, .control-group input:focus {
            outline: none;
            border-color: #58a6ff;
        }

        /* County list */
        .county-list {
            position: absolute;
            bottom: 24px;
            left: 24px;
            z-index: 10;
            background: rgba(13,17,23,0.9);
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px;
            backdrop-filter: blur(8px);
            max-height: 300px;
            overflow-y: auto;
            min-width: 200px;
        }
        .county-list h3 {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #8b949e;
            margin-bottom: 8px;
        }
        .county-item {
            display: flex;
            align-items: center;
            padding: 4px 0;
            cursor: pointer;
            font-size: 13px;
            color: #c9d1d9;
            transition: color 0.15s;
        }
        .county-item:hover { color: #58a6ff; }
        .county-item .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
            flex-shrink: 0;
        }
        .county-item .dot.available { background: #3fb950; }
        .county-item .dot.pending { background: #d29922; }
        .county-item .dot.missing { background: #484f58; }

        /* Info popup */
        .info-banner {
            position: absolute;
            bottom: 24px;
            right: 24px;
            z-index: 10;
            background: rgba(13,17,23,0.9);
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px 16px;
            backdrop-filter: blur(8px);
            font-size: 12px;
            color: #8b949e;
            max-width: 280px;
        }
        .info-banner strong { color: #e6edf3; }
        .info-banner a { color: #58a6ff; text-decoration: none; }

        /* Loading state */
        .loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            text-align: center;
        }
        .loading .spinner {
            width: 32px; height: 32px;
            border: 3px solid #30363d;
            border-top-color: #58a6ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="map"></div>

    <div class="header">
        <h1><span>Exaggerated</span> Relief</h1>
        <div class="subtitle">High-resolution hillshade maps of Illinois — ISGS ILHMP LiDAR</div>
    </div>

    <div class="controls">
        <div class="control-group">
            <label>Style</label>
            <select id="style-select">
                <option value="dark" selected>Dark</option>
                <option value="light">Light</option>
                <option value="tactical">Tactical</option>
                <option value="terrain">Terrain</option>
                <option value="gray">Grayscale</option>
            </select>
        </div>
        <div class="control-group">
            <label>Exaggeration</label>
            <select id="exag-select">
                <option value="3">3×</option>
                <option value="9" selected>9×</option>
                <option value="15">15×</option>
            </select>
        </div>
        <div class="control-group">
            <label>Opacity</label>
            <input type="range" id="opacity-slider" min="0" max="100" value="100" />
        </div>
    </div>

    <div class="county-list" id="county-list">
        <h3>Counties</h3>
        <div id="county-items">Loading...</div>
    </div>

    <div class="info-banner">
        <strong>exaggeratedrelief.com</strong><br/>
        Illinois hillshade tiles generated from
        <a href="https://clearinghouse.isgs.illinois.edu/data/elevation/illinois-height-modernization-ilhmp" target="_blank">ISGS ILHMP</a>
        LiDAR data. 102 counties, 1m resolution.<br/><br/>
        Source: <a href="https://github.com/emuehlstein/illinois-hillshade-gen" target="_blank">ilhmp on GitHub</a>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div>Loading catalog...</div>
    </div>

    <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/pmtiles@4.4.0/dist/pmtiles.js"></script>
    <script>
        // Register PMTiles protocol
        const protocol = new pmtiles.PMTilesProtocol();
        maplibregl.addProtocol('pmtiles', protocol.tile);

        // State
        let catalog = null;
        let currentStyle = 'dark';
        let currentExag = 9;
        let activeLayers = [];

        // PMTiles served directly from S3 (supports Range requests)
        const TILES_BASE = 'https://exaggeratedrelief.s3.us-east-2.amazonaws.com';

        // Illinois center
        const IL_CENTER = [-89.3985, 40.6331];
        const IL_ZOOM = 6.5;

        // Init map
        const map = new maplibregl.Map({
            container: 'map',
            style: {
                version: 8,
                sources: {},
                layers: [{
                    id: 'background',
                    type: 'background',
                    paint: { 'background-color': '#0d1117' }
                }]
            },
            center: IL_CENTER,
            zoom: IL_ZOOM,
            maxZoom: 18,
        });

        map.addControl(new maplibregl.NavigationControl(), 'bottom-right');

        // Load catalog
        async function loadCatalog() {
            try {
                const resp = await fetch('catalog.json');
                catalog = await resp.json();
                document.getElementById('loading').style.display = 'none';
                renderCountyList();
                addTileLayers();
            } catch (e) {
                document.getElementById('loading').innerHTML =
                    '<div style="color: #f85149;">No tiles yet.</div>' +
                    '<div style="margin-top: 8px; font-size: 12px; color: #8b949e;">Run the ilhmp pipeline to generate tiles.</div>';
            }
        }

        function renderCountyList() {
            const container = document.getElementById('county-items');
            if (!catalog || !catalog.layers) {
                container.innerHTML = '<div style="color: #8b949e;">No layers available.</div>';
                return;
            }

            // Group by county
            const counties = {};
            catalog.layers.forEach(l => {
                if (!counties[l.county]) counties[l.county] = [];
                counties[l.county].push(l);
            });

            container.innerHTML = Object.keys(counties).sort().map(county => {
                const layers = counties[county];
                const hasCurrentStyle = layers.some(l =>
                    l.style === currentStyle && l.exaggeration === currentExag
                );
                return `<div class="county-item" data-county="${county}" onclick="flyToCounty('${county}')">
                    <div class="dot ${hasCurrentStyle ? 'available' : 'pending'}"></div>
                    ${layers[0].name || county}
                </div>`;
            }).join('');
        }

        function addTileLayers() {
            if (!catalog || !catalog.layers) return;

            // Remove existing layers
            activeLayers.forEach(id => {
                if (map.getLayer(id)) map.removeLayer(id);
                if (map.getSource(id)) map.removeSource(id);
            });
            activeLayers = [];

            // Add matching layers
            const matching = catalog.layers.filter(l =>
                l.style === currentStyle && l.exaggeration === currentExag
            );

            matching.forEach(layer => {
                const id = `hillshade-${layer.county}-${layer.style}-${layer.exaggeration}x`;
                const pmtilesUrl = `pmtiles://${TILES_BASE}/${layer.pmtiles}`;

                map.addSource(id, {
                    type: 'raster',
                    url: pmtilesUrl,
                    tileSize: 256,
                });

                map.addLayer({
                    id: id,
                    type: 'raster',
                    source: id,
                    paint: {
                        'raster-opacity': document.getElementById('opacity-slider').value / 100,
                    },
                });

                activeLayers.push(id);
            });

            renderCountyList();
        }

        function flyToCounty(countyName) {
            if (!catalog) return;
            const layer = catalog.layers.find(l => l.county === countyName);
            if (layer && layer.bounds) {
                map.fitBounds([
                    [layer.bounds[0], layer.bounds[1]],
                    [layer.bounds[2], layer.bounds[3]]
                ], { padding: 40, duration: 1500 });
            }
        }

        // Controls
        document.getElementById('style-select').addEventListener('change', e => {
            currentStyle = e.target.value;
            addTileLayers();
        });

        document.getElementById('exag-select').addEventListener('change', e => {
            currentExag = parseInt(e.target.value);
            addTileLayers();
        });

        document.getElementById('opacity-slider').addEventListener('input', e => {
            const opacity = e.target.value / 100;
            activeLayers.forEach(id => {
                if (map.getLayer(id)) {
                    map.setPaintProperty(id, 'raster-opacity', opacity);
                }
            });
        });

        // Boot
        map.on('load', loadCatalog);
    </script>
</body>
</html>
